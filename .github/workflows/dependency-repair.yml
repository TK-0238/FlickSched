name: Repair Expo dependencies

on:
  push:
    branches:
      - fix/test-hardening-20260922

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'chore(deps): align Expo SDK 55 dependencies')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/test-hardening-20260922

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Remove redundant React Native types
        run: npm uninstall @types/react-native --save-dev

      - name: Align installed packages with Expo SDK
        run: npx expo install --fix

      - name: Restore web and required native peer dependencies
        run: npx expo install react-native-web react-dom react-native-worklets

      - name: Commit dependency repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "chore(deps): align Expo SDK 55 dependencies"
            git push origin HEAD:fix/test-hardening-20260922
          fi
